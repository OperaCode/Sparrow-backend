name: sparrow-backend

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparrow}
      POSTGRES_DB: ${POSTGRES_DB:-sparrow}
    ports:
      # Bound to loopback so the dev database is not reachable from the LAN.
      # The 5433 default avoids clashing with a locally installed PostgreSQL.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
